[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bar-policy-decision"
version = "1.0.0.dev0"
description = "Load BAR's revised policy-decision benchmark inputs, references and scorers."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND BSD-2-Clause"
license-files = ["LICENSE", "THIRD_PARTY.md", "components/*/UPSTREAM-LICENSE"]
authors = [{ name = "Yanru Xiao" }, { name = "Yifei Cai" }]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
sara = ["numpy"]

[project.scripts]
bar-policy = "bar_policy.cli:main"

[project.urls]
Repository = "https://github.com/SugarRuy/BAR-Policy-Decision"
Paper = "https://arxiv.org/abs/2611.07042"
Documentation = "https://github.com/SugarRuy/BAR-Policy-Decision/blob/main/docs/API.md"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["bar_policy"]
include-package-data = false
